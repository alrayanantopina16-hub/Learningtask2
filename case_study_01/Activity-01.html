<h1>HTML list</h1>
<p>
ordered list are list that is in a particular order.
</p>
<ol>
<li>president</li>
<li>vice president</li>
<li>governor</li>
<li>vice governor</li>
<li>mayor</li>
<li>vice mayor</li>
</ol>
<p>
unordered list are list that is NOT in a particular order.
</p>
<ul>
<li>bananav</li>
<li>grapes</li>
<li>guava</li>
<li>apple</li>
<li>strawberry</li>
<li>orange</li>
</ul>
</body>
